<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AwarDent | ქუიზი — რომელი კბილის პასტა გჭირდება?."
    />
    <title>ქუიზი | AwarDent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f4ee;
        --surface: #ffffff;
        --ink: #17285d;
        --ink-soft: #35507d;
        --hairline: #ddd6c7;
        --accent: #1e7f6e;
        --accent-ink: #d71414;
        --shadow: rgba(23, 40, 93, 0.08);

        --daily: #a1a2a4;
        --daily-ink: #e2e3e4;
        --pearly: #f3f1f2;
        --pearly-ink: #a3969d;
        --probio: #c5bb2c;
        --probio-ink: #d4e591;
        --ortho: #d5761d;
        --ortho-ink: #eda575;
        --sensitive: #543f95;
        --sensitive-ink: #7061a9;
        --gum: #aa5380;
        --gum-ink: #865882;

        --result: var(--accent);
        --result-ink: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #12201d;
          --surface: #1a2c28;
          --ink: #efeae0;
          --ink-soft: #a9bab4;
          --hairline: #2c433d;
          --shadow: rgba(0, 0, 0, 0.25);
        }
      }

      :root[data-theme="dark"] {
        --bg: #12201d;
        --surface: #1a2c28;
        --ink: #efeae0;
        --ink-soft: #a9bab4;
        --hairline: #2c433d;
        --shadow: rgba(0, 0, 0, 0.25);
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Noto Sans Georgian", sans-serif;
        line-height: 1.6;
      }

      a, button {
        transition: all 0.18s ease;
      }

      a:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      .skip-link {
        position: absolute;
        left: 1rem;
        top: -3rem;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--hairline);
        border-radius: 10px;
        padding: 0.7rem 1rem;
        text-decoration: none;
        z-index: 10;
      }

      .skip-link:focus {
        top: 1rem;
      }

      .topbar {
        width: 100%;
        max-width: 720px;
        padding: 1.3rem 1.25rem 0;
      }

      .brand {
        display: inline-flex;
        align-items: baseline;
        gap: 0.2rem;
        font-family: "Noto Serif Georgian", serif;
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        font-weight: 700;
      }

      .brand .accent {
        color: var(--accent);
      }

      .brand small {
        display: block;
        font-family: "Noto Sans Georgian", sans-serif;
        font-size: 0.7rem;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
        margin-top: 0.15rem;
      }

      main {
        width: 100%;
        max-width: 720px;
        padding: 1.2rem 1.25rem 2rem;
      }

      .card {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 24px;
        box-shadow: 0 18px 38px var(--shadow);
        padding: 2rem 1.4rem 1.5rem;
        overflow: hidden;
      }

      .swatches {
        display: flex;
        gap: 0.55rem;
        margin-bottom: 1.4rem;
      }

      .swatches i {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: block;
        border: 1px solid rgba(0, 0, 0, 0.05);
      }

      h1 {
        font-family: "Noto Serif Georgian", serif;
        font-weight: 700;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.15;
        margin: 0 0 0.8rem;
      }

      .lede {
        margin: 0 0 1.5rem;
        color: var(--ink-soft);
        font-size: 1.05rem;
        line-height: 1.7;
        max-width: 50ch;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-bottom: 0.8rem;
      }

      .primary,
      .ghost,
      .opt,
      .buy {
        font-family: "Noto Sans Georgian", sans-serif;
        border-radius: 12px;
        border: none;
        cursor: pointer;
      }

      .primary {
        background: var(--accent);
        color: #ffffff;
        padding: 0.95rem 1.55rem;
        font-weight: 600;
        font-size: 1rem;
      }

      .primary:hover {
        opacity: 0.96;
        transform: translateY(-1px);
      }

      .ghost {
        background: transparent;
        border: 1px solid var(--hairline);
        color: var(--accent-ink);
        padding: 0.78rem 1.2rem;
        font-weight: 500;
        font-size: 0.92rem;
      }

      .ghost:hover {
        background: rgba(215, 20, 20, 0.03);
      }

      .fine {
        font-size: 0.78rem;
        color: var(--ink-soft);
        margin: 0.9rem 0 0;
        line-height: 1.6;
      }

      .progress-row {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        margin-bottom: 1.4rem;
      }

      .progress-track {
        flex: 1;
        height: 6px;
        background: var(--hairline);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: inherit;
        transition: width 0.35s ease;
      }

      .progress-label {
        font-size: 0.8rem;
        color: var(--ink-soft);
        white-space: nowrap;
      }

      h2.question {
        font-family: "Noto Serif Georgian", serif;
        font-weight: 700;
        font-size: clamp(1.5rem, 3vw, 2rem);
        line-height: 1.38;
        margin: 0 0 1.2rem;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }

      .opt {
        text-align: right;
        background: var(--bg);
        border: 1px solid var(--hairline);
        color: var(--ink);
        padding: 0.9rem 1rem;
        font-size: 1rem;
        line-height: 1.55;
      }

      .opt:hover {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, var(--bg));
      }

      .opt:active {
        transform: translateY(1px);
      }

      .result-tag {
        display: inline-block;
        background: color-mix(in srgb, var(--result) 18%, var(--surface));
        color: var(--result-ink);
        border-radius: 999px;
        padding: 0.35rem 0.8rem;
        font-size: 0.76rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }

      .result-head {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .tube {
        flex-shrink: 0;
      }

      .result-name {
        margin: 0 0 0.2rem;
        font-family: "Noto Serif Georgian", serif;
        font-size: clamp(1.5rem, 3vw, 2rem);
      }

      .result-tagline {
        margin: 0;
        font-size: 1rem;
        color: var(--result-ink);
        font-weight: 600;
      }

      .result-points {
        list-style: none;
        padding: 0;
        margin: 0 0 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }

      .result-points li {
        display: flex;
        gap: 0.6rem;
        align-items: flex-start;
        color: var(--ink-soft);
        font-size: 0.96rem;
        line-height: 1.6;
      }

      .result-points li i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--result);
        display: block;
        margin-top: 0.58em;
        flex-shrink: 0;
      }

      .result-note {
        margin: 0 0 1.2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--hairline);
        color: var(--ink-soft);
        font-size: 0.88rem;
        line-height: 1.65;
      }

      .result-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
      }

      .buy {
        display: inline-block;
        background: var(--result);
        color: #ffffff;
        text-decoration: none;
        padding: 0.82rem 1.3rem;
        font-weight: 600;
      }

      .buy:hover {
        opacity: 0.97;
      }

      @media (max-width: 540px) {
        .card {
          padding: 1.6rem 1rem 1.2rem;
        }

        .result-head {
          align-items: flex-start;
        }

        .result-actions {
          flex-direction: column;
        }

        .buy,
        .ghost,
        .primary {
          width: 100%;
          justify-content: center;
          text-align: center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>

        },
        {
          q: "რამდენად ხშირად ამჩნევ პირის ღრუში უსიამოვნო სუნს?",
          options: [
            { label: "თითქმის ყოველდღე", pts: { probio: 2 } },
            { label: "ზოგჯერ, კვირაში რამდენჯერმე", pts: { probio: 1 } },
            { label: "თითქმის არასდროს", pts: {} }
          ]
        }
      ];

      let step = -1;
      const scores = Object.fromEntries(Object.keys(PRODUCTS).map((k) => [k, 0]));
      const app = document.getElementById("app");

      function render() {
        if (step === -1) return renderStart();
        if (step < QUESTIONS.length) return renderQuestion(step);
        return renderResult();
      }

      function renderStart() {
        const cols = Object.keys(PRODUCTS);
        app.innerHTML = `
          <div class="swatches" aria-hidden="true">
            ${cols.map((k) => `<i style="background:${PRODUCTS[k].color}"></i>`).join("")}
          </div>
          <h1>იპოვე პასტა, რომელიც შენს ღიმილს შეეფერება</h1>
          <p class="lede">
            AwarDent-ის ყოველი პასტა სხვადასხვა ფერისაა და სხვადასხვა საჭიროებაზეა მორგებული.
            უპასუხე 4 მოკლე კითხვას და გაიგე, რომელი ფორმულა შეესაბამება შენს კბილებსა და ღრძილებს.
          </p>
          <div class="cta-row">
            <button class="primary" type="button" id="startBtn">ტესტის დაწყება</button>
          </div>
          <p class="fine">
            დამოუკიდებელი, საგანმანათლებლო დემო — ეფუძნება swissfarmaco.ch-ზე გამოქვეყნებულ საჯარო ინფორმაციას.
            კონკრეტული სტომატოლოგიური პრობლემისთვის მიმართე სტომატოლოგს.
          </p>
        `;

        document.getElementById("startBtn").onclick = () => {
          step = 0;
          render();
        };
      }

      function renderQuestion(i) {
        const total = QUESTIONS.length;
        const item = QUESTIONS[i];
        const progressPct = ((i + 1) / total) * 100;

        app.innerHTML = `
          <div class="progress-row">
            <div class="progress-track" role="progressbar" aria-label="ტესტის პროგრესი" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${i + 1}">
              <div class="progress-fill" style="width:${progressPct}%"></div>
            </div>
            <div class="progress-label" aria-live="polite">${i + 1} / ${total}</div>
          </div>
          <h2 class="question">${item.q}</h2>
          <div class="options" role="list">
            ${item.options
              .map(
                (o, idx) =>
                  `<button class="opt" type="button" role="listitem" data-idx="${idx}">${o.label}</button>`
              )
              .join("")}
          </div>
        `;

        app.querySelectorAll(".opt").forEach((btn) => {
          btn.onclick = () => {
            const opt = item.options[Number(btn.dataset.idx)];
            Object.entries(opt.pts).forEach(([k, v]) => {
              scores[k] += v;
            });
            step += 1;
            render();
          };
        });
      }

      function pickWinner() {
        let best = TIEBREAK[TIEBREAK.length - 1];
        let bestScore = -1;

        TIEBREAK.forEach((k) => {
          if (scores[k] > bestScore) {
            bestScore = scores[k];
            best = k;
          }
        });

        return PRODUCTS[best];
      }

      function tubeSvg(color) {
        return `<svg class="tube" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="14" y="4" width="20" height="10" rx="3" fill="${color}" opacity="0.55"/>
          <path d="M12 14h24c2 0 3 1.3 3 3.4V52c0 5-4.4 8-14.5 8S10 57 10 52V17.4C10 15.3 11 14 12 14Z" fill="${color}"/>
          <path d="M10 26c8 3 26 3 34 0" stroke="white" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
        </svg>`;
      }

      function renderResult() {
        const p = pickWinner();
        app.style.setProperty("--result", p.color);
        app.style.setProperty("--result-ink", p.colorInk);

        app.innerHTML = `
          <span class="result-tag">შენი შედეგი</span>
          <div class="result-head">
            ${tubeSvg(p.color)}
            <div>
              <h2 class="result-name">${p.name}</h2>
              <p class="result-tagline">${p.tagline}</p>
            </div>
          </div>
          <ul class="result-points">
            ${p.points.map((pt) => `<li><i></i>${pt}</li>`).join("")}
          </ul>
          <p class="result-note">${p.note}</p>
          <div class="result-actions">
            <a class="buy" href="${p.link}" target="_blank" rel="noopener" aria-label="გადადით ${p.name} პროდუქტის გვერდზე">პროდუქტის გვერდზე გადასვლა</a>
            <button class="ghost" type="button" id="restartBtn">თავიდან დაწყება</button>
          </div>
        `;

        document.getElementById("restartBtn").onclick = () => {
          step = -1;
          Object.keys(scores).forEach((k) => (scores[k] = 0));
          render();
        };
      }

      app.setAttribute("tabindex", "-1");
      app.focus();
      render();
    </script>
  </body>
</html>
